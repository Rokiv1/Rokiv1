<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Magnificent Reunion</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 18% 18%,rgba(255,255,255,.13),transparent 28%),radial-gradient(circle at 82% 82%,rgba(255,255,255,.10),transparent 30%),linear-gradient(145deg,#b98286,#c58b8f 48%,#a96f76);color:#fff;padding:24px}.card{width:min(920px,100%);text-align:center;padding:48px 28px;border:1px solid rgba(255,255,255,.22);border-radius:30px;background:rgba(255,245,245,.13);backdrop-filter:blur(18px);box-shadow:0 25px 80px rgba(75,35,42,.28)}.heart{font-size:42px;margin-bottom:8px}h1{margin:0;font-size:clamp(2.1rem,6vw,4.6rem);letter-spacing:.02em}.route{margin:18px 0 34px;font-size:clamp(1rem,2.5vw,1.35rem);opacity:.9}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 auto 30px;max-width:760px}.unit{padding:20px 10px;border-radius:20px;background:rgba(86,43,49,.15);border:1px solid rgba(255,255,255,.16)}.number{font-family:Arial,sans-serif;font-size:clamp(2rem,7vw,4.8rem);font-weight:700;line-height:1}.label{margin-top:10px;font-family:Arial,sans-serif;font-size:.78rem;letter-spacing:.18em;opacity:.72}.date{font-family:Arial,sans-serif;font-size:1rem;opacity:.85}.message{margin-top:30px;font-size:clamp(1.1rem,3vw,1.45rem);font-style:italic}#done{display:none}#done h2{font-size:clamp(2.4rem,7vw,5rem);margin:12px 0}#done p{font-size:1.25rem}@media(max-width:560px){.card{padding:34px 15px;border-radius:24px}.countdown{gap:7px}.unit{padding:16px 5px;border-radius:15px}.label{font-size:.62rem;letter-spacing:.1em}}
</style>
</head>
<body><main class="card"><div class="heart">❤️</div><h1>Our Magnificent Reunion</h1><div class="route">🇬🇭 Ghana &nbsp;→&nbsp; ✈️ &nbsp;→&nbsp; 🇯🇵 Sapporo</div><section id="timer"><div class="countdown"><div class="unit"><div class="number" id="days">0</div><div class="label">DAYS</div></div><div class="unit"><div class="number" id="hours">0</div><div class="label">HOURS</div></div><div class="unit"><div class="number" id="minutes">0</div><div class="label">MINUTES</div></div><div class="unit"><div class="number" id="seconds">0</div><div class="label">SECONDS</div></div></div><div class="date">October 6, 2026 · 6:00 AM GMT · 3:00 PM Sapporo</div><div class="message">Every second brings us closer. ❤️</div></section><section id="done"><div class="heart">❤️</div><h2>You're Here.</h2><p>The waiting is over.</p><p><strong>Welcome home, Kay.</strong></p></section></main><script>const target=new Date("2026-10-06T06:00:00Z").getTime();function update(){const now=Date.now();let diff=target-now;if(diff<=0){document.getElementById("timer").style.display="none";document.getElementById("done").style.display="block";return}const days=Math.floor(diff/86400000);diff%=86400000;const hours=Math.floor(diff/3600000);diff%=3600000;const minutes=Math.floor(diff/60000);const seconds=Math.floor((diff%60000)/1000);document.getElementById("days").textContent=days;document.getElementById("hours").textContent=String(hours).padStart(2,"0");document.getElementById("minutes").textContent=String(minutes).padStart(2,"0");document.getElementById("seconds").textContent=String(seconds).padStart(2,"0")}update();setInterval(update,1000);</script></body></html>
